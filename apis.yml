aid: bond-capital
name: BOND
description: >-
  BOND is a San Francisco-based growth-stage venture capital firm founded in 2018 by
  Mary Meeker, Mood Rowghani, Noah Knauf, and Juliet de Baubigny as a spinout of the
  Kleiner Perkins Digital Growth Fund. BOND backs proven, high-growth internet and
  software companies that have already established product-market fit, helping them
  scale globally toward IPO readiness. The firm invests primarily at the late/growth
  stage (roughly Series C and beyond) and is known for Mary Meeker's influential
  multi-hundred-page Internet Trends and AI Trends reports. Sectors span artificial
  intelligence, developer tools and infrastructure, fintech, health and biotech,
  consumer and marketplaces, and frontier hardware. BOND has raised three funds -
  $1.25B (2019), $2B (2021), and $2.5B (2022) - and its portfolio and track record
  include Canva, OpenAI, Stripe, Postman, Netlify, Revolut, Ironclad, Applied
  Intuition, DoorDash, Duolingo, and Uber.
